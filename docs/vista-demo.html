function show(path,query=''){document.body.innerHTML=views[path]||views['/'];const bar=document.querySelector('.demo-bar');if(bar)bar.textContent='VISTA OFFLINE · Solo exploración · Registros DEMO · Administración y mapa requieren servidor';if(path==='/explorar'){const params=new URLSearchParams(query);filter(params.get('q')||'',params.get('category')||'');}window.scrollTo(0,0);}
function filter(q,category){let count=0;document.querySelectorAll('.place-card').forEach(card=>{const match=card.textContent.toLocaleLowerCase('es').includes(q.toLocaleLowerCase('es'))&&(!category||card.querySelector('.card-meta span')?.textContent===category);card.hidden=!match;if(match)count++;});const title=document.querySelector('.results-head b');if(title)title.textContent=count+' lugares DEMO';const input=document.querySelector('#q');if(input)input.value=q;const select=document.querySelector('#category');if(select)select.value=category;const cards=document.querySelector('.cards');if(cards&&!count){const msg=document.createElement('p');msg.textContent='No encontramos lugares con estos filtros.';cards.after(msg);}}
document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a)return;const href=a.getAttribute('href');if(!href||href.startsWith('#')||href.startsWith('https:'))return;e.preventDefault();const url=new URL(href,'https://vista.local');if(url.pathname==='/admin'){alert('Esta vista es de solo lectura. El panel editorial funciona en la aplicación con servidor, no en este archivo.');return;}show(url.pathname,url.search);});
