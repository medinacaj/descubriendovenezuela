services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: venezuela
      POSTGRES_USER: venezuela
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venezuela -d venezuela"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
