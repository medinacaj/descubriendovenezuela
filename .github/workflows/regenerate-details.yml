name: Generar fichas editoriales
on:
  push:
    branches: [feat/fichas-destinos-busqueda-caché-20261106]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Regenerar las 29 fichas y archivos de caché
        run: npm run build:pages
      - name: Revisar salida editorial
        run: |
          test -s docs/lugares/parque-nacional-morrocoy/index.html
          test -s docs/lugares/merida-ciudad/index.html
          grep -q 'place-cover--photo' docs/lugares/parque-nacional-morrocoy/index.html
          grep -q 'place-cover--map' docs/lugares/merida-ciudad/index.html
          grep -q 'q.addEventListener("input"' docs/explorar/index.html
          grep -q 'BASE+"states.css"' docs/sw.js
      - name: Versionar los HTML generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "docs: actualizar fichas de destinos y filtrado del explorador"
            git push origin HEAD:feat/fichas-destinos-busqueda-caché-20261106
          fi
