name: Regenerar páginas territoriales
on:
  push:
    branches: [feature/jerarquia-estados-y-destinos-20261106]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Instalar
        run: npm ci
      - name: Generar HTML y CSS desde catálogo
        run: npm run build:pages
      - name: Comprobar páginas principales
        run: |
          test -s docs/estados/index.html
          test -s docs/regiones/falcon/index.html
          test -s docs/regiones/merida/index.html
          test -s docs/states.css
          grep -q 'data-featured-id="parque-nacional-morrocoy"' docs/regiones/falcon/index.html
          grep -q 'Descubre Venezuela por estado' docs/index.html
      - name: Versionar fichas regeneradas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "docs: publicar índice de estados y nuevas fichas regionales"
            git push origin HEAD:feature/jerarquia-estados-y-destinos-20261106
          fi
