name: Importar fotografías de destinos con licencias comprobadas
on:
  push:
    paths:
      - "content/licensed-photographs.json"
      - "scripts/build-directories.mjs"
      - "scripts/optimize-images.mjs"
      - ".github/workflows/importar-fotos.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Dependencias
        run: npm ci
      - name: Descargar solo fotos con autor y licencia registrados
        run: node scripts/import-licensed-photos.mjs --only-missing
      - name: Optimizar imágenes locales a 480 y 800 px
        run: node scripts/optimize-images.mjs
      - name: Regenerar fichas y vistas estáticas
        run: npm run build:pages
      - name: Validar fuente y archivo generado
        run: |
          node --input-type=module -e 'import {readFileSync,statSync} from "node:fs";const p=JSON.parse(readFileSync("content/places.json"));for(const place of p)for(const m of place.photos){if(statSync("docs/"+m.src).size<5000)process.exit(1)}'
      - name: Versionar únicamente fotos auditadas y archivos generados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/places.json docs/
          if ! git diff --cached --quiet; then
            git commit -m "media: incorporar fotografías reales de destinos con atribuciones verificadas"
            git push origin HEAD:main
          else
            echo "Sin fotografías nuevas pendientes"
          fi
