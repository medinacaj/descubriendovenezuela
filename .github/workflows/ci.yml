name: Validacion continua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    # Repositorio público: runners estándar y Pages sin servicios de pago.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: venezuela
          POSTGRES_PASSWORD: ci-local-only-password
          POSTGRES_DB: venezuela
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U venezuela -d venezuela"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Prepare isolated database
        run: |
          printf '%s\n' \
            'POSTGRES_PASSWORD=ci-local-only-password' \
            'DATABASE_URL=postgresql://venezuela:ci-local-only-password@127.0.0.1:5432/venezuela' \
            'APP_ORIGIN=http://localhost:3000' > .env
          npm run db:migrate
          npx tsx scripts/prepare-tests.ts
      - name: Validate editorial evidence and licensing
        run: npm run editorial:check
      - name: Generate public site
        run: npm run build:pages
      - name: Check generated files are committed
        run: git diff --exit-code -- docs/
      - name: Typecheck
        run: npm run typecheck
      - name: Test application and generated site
        run: DATABASE_URL=postgresql://venezuela:ci-local-only-password@127.0.0.1:5432/venezuela_test npm test
      - name: Preparar demo editorial en la base desechable de CI
        run: |
          mkdir -p .data
          ALLOW_DEMO_IMPORT=yes npx tsx scripts/demo.ts
          npx tsx scripts/demo-admin.ts
      - name: Import sourced catalog twice to prove idempotence
        run: |
          npm run catalog:import
          npm run catalog:import
          node --env-file=.env --input-type=module -e 'import pg from "pg";import {readFileSync} from "node:fs";const expected=JSON.parse(readFileSync("content/places.json","utf8")).length;const c=new pg.Client({connectionString:process.env.DATABASE_URL});await c.connect();const r=await c.query("select count(*)::int as n from places where catalog_id is not null");if(r.rows[0].n!==expected)process.exit(1);await c.end()'
      - name: Production build
        run: npm run build
      - name: Preparar navegador para Playwright
        run: |
          if command -v google-chrome-stable >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v google-chrome-stable)" >> "$GITHUB_ENV"
          elif command -v google-chrome >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROMIUM_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Static site browser checks
        run: npm run test:pages

      - name: Instalar motores Firefox y WebKit para pruebas de compatibilidad
        timeout-minutes: 8
        run: npx playwright install --with-deps firefox webkit
      - name: Comprobar navegación en Firefox
        run: BROWSER_ENGINE=firefox npm run test:pages
      - name: Comprobar navegación en WebKit (motor Safari)
        run: BROWSER_ENGINE=webkit npm run test:pages
      - name: Instalar axe-core temporalmente para revisión WCAG
        run: npm install --no-save --no-package-lock --ignore-scripts axe-core@4.10.3
      - name: Analizar accesibilidad estática (WCAG 2.2 A/AA)
        run: node scripts/audit-accessibility.mjs

      - name: Flujo Next · rutas públicas y publicar/retirar con sesión
        run: npm run test:e2e
      - name: Crear artefacto con solo páginas y recursos públicos
        run: node scripts/stage-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/pages

  publicar:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar catálogo validado
        id: deploy
        uses: actions/deploy-pages@v4
