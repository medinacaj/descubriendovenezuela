name: Incorporar fotografías licenciadas y generar Pages
on:
  push:
    branches: [feature/fotografias-reales-con-licencia-20261106]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Descargar y optimizar fotografías de Wikimedia Commons
        run: node scripts/import-licensed-photos.mjs
      - name: Regenerar fichas y portada
        run: npm run build:pages
      - name: Validar referencias locales y derechos
        run: npm run typecheck
      - name: Guardar fotografías, fichas y créditos en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/places.json docs/
          if ! git diff --cached --quiet; then
            git commit -m "assets: versionar doce fotografías reales y regenerar catálogo"
            git push origin HEAD:feature/fotografias-reales-con-licencia-20261106
          fi
