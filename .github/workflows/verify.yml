name: Verificación de catálogo y aplicación
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: venezuela
          POSTGRES_PASSWORD: ci-only-not-for-production
          POSTGRES_DB: venezuela
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U venezuela -d venezuela"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://venezuela:ci-only-not-for-production@127.0.0.1:5432/venezuela
      APP_ORIGIN: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Obtener código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Preparar base aislada
        run: |
          printf '%s\n' "DATABASE_URL=$DATABASE_URL" "APP_ORIGIN=$APP_ORIGIN" > .env
          npm run db:migrate
          npx tsx scripts/prepare-tests.ts
      - name: Probar dominio, catálogo e integración
        run: npm test
      - name: Verificar tipos
        run: npm run typecheck
      - name: Probar importación idempotente
        run: |
          npm run catalog:import
          npm run catalog:import
          node --input-type=module -e "import pg from 'pg';const db=new pg.Client({connectionString:process.env.DATABASE_URL});await db.connect();const r=await db.query('SELECT count(*)::int AS count FROM places WHERE catalog_id IS NOT NULL');if(r.rows[0].count!==9)process.exitCode=1;await db.end();"
      - name: Compilar producción y catálogo estático
        run: |
          npm run build
          npm run build:pages
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Probar páginas estáticas
        run: npm run test:pages
