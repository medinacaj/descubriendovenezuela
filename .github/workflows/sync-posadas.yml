name: Regenerar catálogo de posadas

on:
  push:
    branches:
      - feat/posadas-escapadas-familiares-2026
    paths:
      - content/places.json
      - scripts/build-directories.mjs
      - scripts/region-pages.mjs
      - .github/workflows/sync-posadas.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate GitHub Pages catalog
        run: npm run build:pages
      - name: Commit generated pages to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate sourced posadas and family pages"
            git push origin HEAD:feat/posadas-escapadas-familiares-2026
          fi
